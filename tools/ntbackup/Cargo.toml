[package]
name = "ntbackup"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Decrypt a Notes Tech .ntbackup file and export its notes as Markdown (plain or Logseq)"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "ntbackup"
path = "src/main.rs"

[dependencies]
aes-gcm = { version = "0.10", features = ["zeroize"] }
anyhow = "1"
argon2 = { version = "0.5", features = ["zeroize"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
hmac = "0.12"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
unicode-normalization = "0.1"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2"
hex = "0.4"
rand = "0.8"
tempfile = "3"

# Argon2id with 64 MiB takes seconds unoptimised: the tests derive many keys.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
strip = true
lto = true
